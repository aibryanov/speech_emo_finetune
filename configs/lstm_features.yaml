fine_tune_strategy: lstm_features
feature_type: mfcc_logmel   # mfcc | mfcc_delta | logmel | mfcc_logmel | combined
n_mfcc: 60
n_mels: 100
n_fft: 1024
hop_length: 120
lstm_hidden: 512
lstm_layers: 1
lstm_dropout: 0.1
mlp_hidden: [1024, 256]
mlp_dropout: 0.3
augment: true
aug_noise_std: 0.005
aug_time_mask_ratio: 0.1
aug_amplitude_range: [0.8, 1.2]
batch_size: 32
grad_accum_steps: 1
lr: 1.0e-3
epochs: 30
run_name: lstm_features
output_dir: outputs/lstm_features
