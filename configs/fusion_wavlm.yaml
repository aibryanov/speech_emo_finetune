# Stage 1: train BiLSTM standalone
#   python train.py configs/lstm_features.yaml
# Stage 2: freeze BiLSTM, train fusion MLP
#   set lstm_pretrained below, then run this config
model_name: Aniemore/wavlm-emotion-russian-resd
processor_name: microsoft/wavlm-base
fine_tune_strategy: fusion
# BiLSTM on audio features — must match lstm_features.yaml exactly
lstm_hidden: 512
lstm_layers: 1
lstm_dropout: 0.1
feature_type: mfcc_logmel
n_mfcc: 60
n_mels: 100
n_fft: 1024
hop_length: 120
# MLP fusion head
fusion_hidden: 512
fusion_dropout: 0.3
# training
batch_size: 8
grad_accum_steps: 4
lr: 1.0e-3
epochs: 30
weight_decay: 0.01
scheduler_type: cosine
warmup_ratio: 0.05
# path to pre-trained BiLSTM checkpoint (from lstm_features run)
# leave empty to train BiLSTM from scratch jointly with MLP
lstm_pretrained: outputs/lstm_features/best_model.pt
run_name: fusion_wavlm
output_dir: outputs/fusion_wavlm
